version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: hunting_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-hunting_crm}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: always

  redis:
    image: redis:7-alpine
    container_name: hunting_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hunting_backend
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - API_PORT=3000
      - SMTP_SERVER=${SMTP_SERVER}
      - SMTP_PORT=${SMTP_PORT}
      - EMAIL_EMISOR=${EMAIL_EMISOR}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
      - EMAIL_DESTINO=${EMAIL_DESTINO}
      - EMAIL_CC_FICHA_DATOS=${EMAIL_CC_FICHA_DATOS}
      - EMAIL_CC_ASIGNACION=${EMAIL_CC_ASIGNACION}
      - GOOGLE_SHEETS_SPREADSHEET_ID=${GOOGLE_SHEETS_SPREADSHEET_ID}
      - GOOGLE_SHEETS_SHEET_NAME=${GOOGLE_SHEETS_SHEET_NAME}
      # Montamos el credential al contenedor
      - GOOGLE_SERVICE_ACCOUNT_FILE=/app/credentials/service_account.json
      - INITIAL_ADMIN_EMAIL=${INITIAL_ADMIN_EMAIL}
      - INITIAL_ADMIN_PASSWORD=${INITIAL_ADMIN_PASSWORD}
      - INITIAL_ADMIN_NAME=${INITIAL_ADMIN_NAME}
    volumes:
      - ./credentials:/app/credentials:ro
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hunting_frontend
    environment:
      # El frontend consumirá la API proxyficada
      - VITE_API_URL=/api
    # El puerto interno es 80 (Nginx), no se expone al host porque el proxy global se encargará
    depends_on:
      - backend
    restart: always

  proxy:
    image: nginx:alpine
    container_name: hunting_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    restart: always

volumes:
  postgres_data:
  redis_data:
